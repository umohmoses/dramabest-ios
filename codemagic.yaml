# Dramabest iOS build on Codemagic (builds on Codemagic's Mac, uploads to App Store Connect / TestFlight).
#
# Already in this project: bundle com.dramabest.story, Team G9RMQSFTQQ, App Store Apple ID 6809405695,
# Firebase iOS config (ios/Runner/GoogleService-Info.plist, project dramabest-25b22).
# Codemagic needs only: Team settings -> Integrations -> Developer Portal key named "dramabest" (done),
# then start the "Dramabest iOS -> TestFlight" workflow.
workflows:
  ios-testflight:
    name: Dramabest iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: dramabest
    environment:
      flutter: 3.32.6
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dramabest.story
      vars:
        BUNDLE_ID: com.dramabest.story
        APP_STORE_APPLE_ID: 6809405695 # App Store Connect -> Dramabest -> App Information -> Apple ID
    scripts:
      - name: Check Firebase config for iOS
        script: |
          set -e
          PLIST_BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" ios/Runner/GoogleService-Info.plist)
          if [ "$PLIST_BUNDLE" != "$BUNDLE_ID" ]; then echo "GoogleService-Info.plist is for $PLIST_BUNDLE, expected $BUNDLE_ID"; exit 1; fi
          REVERSED=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" ios/Runner/GoogleService-Info.plist)
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $REVERSED" ios/Runner/Info.plist
          echo "Firebase iOS config OK"
      - name: AdMob iOS App ID from the admin dashboard
        script: sh ios/sync_admob_app_id.sh || echo "Keeping the AdMob App ID already in Info.plist"
      - name: Packages
        script: |
          flutter pub get
          cd ios && pod install --repo-update
      - name: Signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          set -e
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          [ -z "$LATEST" ] && LATEST=0
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *\([^+]*\).*/\1/')
          flutter build ipa --release --build-name="$NAME" --build-number=$((LATEST + 1)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
